version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# fhir-staging — production / shared stack
#
# Usage:
#   1. Copy .env.example to .env and fill in the required values
#   2. docker compose -f docker-compose.prod.yml up -d
#
# The API image is pulled from GitHub Container Registry — no source code needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    image: ghcr.io/naveenraj-g/fhir-staging:latest
    container_name: fhir-staging
    ports:
      - "8002:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - fhir-staging-net

  db:
    image: postgres:15-alpine
    container_name: fhir-staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-fhir-staging}
    # Published on the host — Airflow (and anything else outside this
    # compose network) connects here directly rather than through the API.
    ports:
      - "${POSTGRES_PORT:-5489}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fhir-staging}",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - fhir-staging-net

volumes:
  postgres_data:

networks:
  fhir-staging-net:
    driver: bridge
