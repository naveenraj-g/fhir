version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Local development stack — Postgres only.
#
# Use this when running the API directly on the host with hot reload
# (`just dev` / `uv run uvicorn app.main:app --reload`) instead of inside a
# container. For the full containerized stack (API + Postgres), use
# docker-compose.yml instead.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then point your .env at the mapped port, e.g.:
#   STAGING_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/fhir-staging
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:15-alpine
    container_name: fhir-staging-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fhir-staging}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fhir-staging}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_dev_data:
