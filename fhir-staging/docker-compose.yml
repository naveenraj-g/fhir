version: "3.9"

services:
  api:
    build: .
    # image: ghcr.io/naveenraj-g/fhir-staging:latest  # use pre-built image instead
    container_name: fhir-staging
    ports:
      - "8002:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - staging-net

  db:
    image: postgres:15-alpine
    container_name: fhir-staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-fhir-staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fhir-staging}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - staging-net

volumes:
  postgres_data:

networks:
  staging-net:
    driver: bridge
